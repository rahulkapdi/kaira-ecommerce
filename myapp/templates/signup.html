{% extends 'main.html' %}
{% load static %}
{% block content %}

<section class="py-5 bg-light" style="min-height: 70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card border-0 shadow-sm mt-5">
          <div class="card-body p-5">
            <h2 class="text-center text-uppercase mb-1" style="font-family: 'Marcellus', serif;">Create Account</h2>
            <p class="text-center text-muted mb-4 fs-6">Join Kaira and start shopping</p>

            <form method="post" action="{% url 'signup' %}">
                {% csrf_token %}

              <div class="mb-3">
                <label for="username" class="form-label text-uppercase fs-6 fw-semibold">Username</label>
                <input type="text" class="form-control form-control-lg border-0 border-bottom rounded-0 px-0"
                  id="username" name="username" placeholder="Choose a username" required
                  value="{{ request.POST.username }}">
              </div>

              <div class="mb-3">
                <label for="email" class="form-label text-uppercase fs-6 fw-semibold">Email Address</label>
                <input type="email" class="form-control form-control-lg border-0 border-bottom rounded-0 px-0"
                  id="email" name="email" placeholder="Enter your email" required
                  value="{{ request.POST.email }}">
              </div>

              <div class="mb-3">
                <label for="password1" class="form-label text-uppercase fs-6 fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg border-0 border-bottom rounded-0 px-0"
                  id="password1" name="password1" placeholder="At least 8 characters" required>
              </div>

              <div class="mb-4">
                <label for="password2" class="form-label text-uppercase fs-6 fw-semibold">Confirm Password</label>
                <input type="password" class="form-control form-control-lg border-0 border-bottom rounded-0 px-0"
                  id="password2" name="password2" placeholder="Repeat your password" required>
              </div>

              <div class="d-grid mb-3">
                <button type="submit" class="btn btn-dark btn-lg text-uppercase rounded-0 py-3">Create Account</button>
              </div>

              <p class="text-center mt-3 fs-6">
                Already have an account?
                <a href="{% url 'login' %}" class="text-dark fw-semibold text-decoration-underline">Sign In</a>
              </p>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>

{% endblock content %}
