{% extends 'main.html' %}
{% load static %}
{% block content %}

<section class="py-5 bg-light" style="min-height: 70vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card border-0 shadow-sm mt-4">
          <div class="card-body p-5">

            <div class="text-center mb-4">
              <div class="rounded-circle bg-dark d-inline-flex align-items-center justify-content-center mb-3"
                style="width:80px;height:80px;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="white">
                  <path d="M15.71 12.71a6 6 0 1 0-7.42 0a10 10 0 0 0-6.22 8.18a1 1 0 0 0 2 .22a8 8 0 0 1 15.9 0a1 1 0 0 0 1 .89h.11a1 1 0 0 0 .88-1.1a10 10 0 0 0-6.25-8.19ZM12 12a4 4 0 1 1 4-4a4 4 0 0 1-4 4Z"/>
                </svg>
              </div>
              <h2 class="text-uppercase mb-0" style="font-family: 'Marcellus', serif;">{{ user.username }}</h2>
              <p class="text-muted fs-6">Member since {{ user.date_joined|date:"F Y" }}</p>
            </div>

            <hr class="mb-4">

            <h5 class="text-uppercase mb-3 fs-6 fw-bold">Edit Profile</h5>
            <form method="post" action="{% url 'profile' %}">
              {% csrf_token %}

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label text-uppercase fs-6 fw-semibold">First Name</label>
                  <input type="text" name="first_name"
                    class="form-control border-0 border-bottom rounded-0 px-0"
                    value="{{ user.first_name }}" placeholder="First name">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label text-uppercase fs-6 fw-semibold">Last Name</label>
                  <input type="text" name="last_name"
                    class="form-control border-0 border-bottom rounded-0 px-0"
                    value="{{ user.last_name }}" placeholder="Last name">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label text-uppercase fs-6 fw-semibold">Username</label>
                <input type="text" class="form-control border-0 border-bottom rounded-0 px-0 text-muted"
                  value="{{ user.username }}" disabled>
              </div>

              <div class="mb-4">
                <label class="form-label text-uppercase fs-6 fw-semibold">Email Address</label>
                <input type="email" name="email"
                  class="form-control border-0 border-bottom rounded-0 px-0"
                  value="{{ user.email }}" placeholder="Email address" required>
              </div>

              <div class="d-flex gap-3">
                <button type="submit" class="btn btn-dark text-uppercase rounded-0 px-4 py-2">Save Changes</button>
                <a href="{% url 'home' %}" class="btn btn-outline-secondary text-uppercase rounded-0 px-4 py-2">Back to Shop</a>
              </div>
              
            </form>

            <hr class="mt-5 mb-4">

            <div class="d-flex justify-content-between align-items-center">
              <h5 class="text-uppercase fs-6 fw-bold mb-0">Account Actions</h5>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-dark text-uppercase rounded-0 px-4">Logout</button>
              </form>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>

{% endblock content %}
