{% extends "main.html" %}

{% block content %}

<div class="container py-5 text-center">

    <h2 class="text-success">
        🎉 Order Placed Successfully!
    </h2>

    <p class="mt-3">
        Your Order ID is
        <strong>#{{ order.id }}</strong>
    </p>

    <p>
        Payment Method:
        {{ order.get_payment_method_display }}
    </p>

    <p>
        Total:
        ₹{{ order.total_price }}
    </p>

    <a href="{% url 'shop' %}" class="btn btn-dark mt-3">
        Continue Shopping
    </a>

</div>

{% endblock %}
